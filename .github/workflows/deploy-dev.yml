name: Deploy Dev

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Decode SSH key from base64
        run: |
          echo "${{ secrets.EC2_KEY }}" | base64 -d > private_key
          chmod 600 private_key

      - name: SSH and run deploy script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: private_key
          script: |
            bash ~/snapshot-dev/.deployment/deploy-dev.sh
